<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Image Slider</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .slider {
      position: relative;
      width: 200px;
      height: 200px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 1);
      transform-style: preserve-3d;
      animation: rotate 15s infinite linear;
    }

    .slider:hover {
      animation-play-state: paused; /* Pause rotation on hover */
    }

    .slider img {
      position: absolute;
      object-fit: cover;
      border-radius: 50px;
      cursor: pointer;
      height: 100%;
      width: 100%;
      transition: transform 0.3s ease;
    }

    /* Zoom on hover while keeping 3D position */
    .slider img:nth-child(1) {
      transform: rotateY(0deg) translateZ(400px);
    }
    .slider img:nth-child(1):hover {
      transform: rotateY(0deg) translateZ(400px) scale(1.1);
    }

    .slider img:nth-child(2) {
      transform: rotateY(90deg) translateZ(400px);
    }
    .slider img:nth-child(2):hover {
      transform: rotateY(90deg) translateZ(400px) scale(1.1);
    }

    .slider img:nth-child(3) {
      transform: rotateY(180deg) translateZ(400px);
    }
    .slider img:nth-child(3):hover {
      transform: rotateY(180deg) translateZ(400px) scale(1.1);
    }

    .slider img:nth-child(4) {
      transform: rotateY(270deg) translateZ(400px);
    }
    .slider img:nth-child(4):hover {
      transform: rotateY(270deg) translateZ(400px) scale(1.1);
    }

    .slider img:nth-child(5) {
      transform: rotateY(360deg) translateZ(400px);
    }
    .slider img:nth-child(5):hover {
      transform: rotateY(360deg) translateZ(400px) scale(1.1);
    }

    @keyframes rotate {
      from {
        transform: rotateY(0deg);
      }
      to {
        transform: rotateY(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="slider">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQaHlgkvSBjLFpLP282EpgmO5qRqRcsCiM_rQ&s" alt="Image1">
    <img src="https://marketing.caddcentre.com/storage/uploads/Kv6idwkAS36yWLCtAyRtBQaDlzHw5xRcKWYadaZh.jpg" alt="Image2">
    <img src="https://i0.wp.com/www.toonsmag.com/wp-content/uploads/2018/10/Mickey-Mouse.png?resize=311%2C311&ssl=1" alt="Image3">
    <img src="https://cdn.magicdecor.in/com/2023/02/29215506/image-1684841044-647-710x488.jpg" alt="Image4">
    <img src="https://cdn.magicdecor.in/com/2023/02/29215506/image-1684841044-647-710x488.jpg" alt="Image5">
  </div> 
</body>
</html>
